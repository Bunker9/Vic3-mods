l_english:
 knip_naval_buildup:0 "A Navy for the Rising Sun"
 knip_naval_buildup_desc:0 "The sea is our rampart and our road. Lay down troop fleets and naval administrations across the home islands, and let our fisheries and whalers swell into a true marine industry, so that Japan may project power beyond its shores."
 knip_claim_korea:0 "The Korean Question"
 knip_claim_korea_desc:0 "With a fleet worthy of an empire, the peninsula across the strait can no longer be ignored. Lay our claim to every province of Korea, from Pyongyang to Busan."
 knip_marine_hiring:0 "Marine Industry Reforms"
 knip.1.t:0 "The Fisheries Boom"
 knip.1.d:0 "Refrigerated holds and new wharves are transforming our coasts. Order another round of fisheries and whaling stations wherever our waters can still sustain them."
 knip.1.a:0 "Let the catch grow"
 knip_imperial_troop_fleet:0 "Jōbi Kantai"
