 ptm_rice_expansion_decision:0 "The Granary of the Empire"
 ptm_rice_expansion_decision_desc:0 "Our provinces feed an empire, yet the paddies lie half worked. Order the magistrates to flood every terrace that will hold water and bring the harvest up to what the land can truly bear."
 ptm_china_railways_decision:0 "Iron Road Concession"
 ptm_china_railways_decision_desc:0 "Our concession gives us the standing to lay track far beyond the treaty port. Fund a trunk line through every populous Chinese province. The rails will be Chinese property, but the trade they carry will pass through our wharves."
 ptm_china_mining_decision:0 "Powder and Pit Concession"
 ptm_china_mining_decision_desc:0 "Modern blasting powder opens seams that hand tools never reached. Put our engineers to work in the coal, iron, lead and sulfur of the populous provinces, and let the ore find its way to our holds."

 ptm_rice_expansion_tt:0 "Brings every rice paddy the land can support up to full working strength"
 ptm_china_railways_tt:0 "Lays a trunk line through every populous Chinese province"
 ptm_china_mining_tt:0 "Deepens the coal, iron, lead and sulfur workings of every populous Chinese province"
