 ptm_rice_expansion_decision:0 "The Granary of the Empire"
 ptm_rice_expansion_decision_desc:0 "Our provinces feed an empire, yet the paddies lie half worked. Order the magistrates to flood every terrace that will hold water and bring the harvest up to what the land can truly bear."
 ptm_china_railways_decision:0 "Iron Road Concession"
 ptm_china_railways_decision_desc:0 "Our concession gives us the standing to lay track far beyond the treaty port. Raise the construction works and fund a trunk line through every populous Chinese province. The rails will be Chinese property, but the trade they carry passes through our wharves, where new trade houses and motor works rise under our own flag."
 ptm_china_mining_decision:0 "Powder and Pit Concession"
 ptm_china_mining_decision_desc:0 "Modern blasting powder opens seams that hand tools never reached. Put our engineers to work in the coal, iron, lead and sulfur of the populous provinces, all held under our own flag, and raise powder mills in the treaty port to feed them."

 ptm_gp_china_treaty_port_tt:0 "Is a great power holding a treaty port in China"

 ptm_reclaim_lapsed_port:0 "Reclaim Our Lapsed Treaty Port"
 ptm_reclaim_lapsed_port_desc:0 "A port once ceded to us by treaty has slipped from our grasp, taken by another power. Press the old claim and open a diplomatic play to restore the concession, by force of arms if it comes to that."
 ptm_reclaim_lapsed_port_tt:0 "Opens a diplomatic play to retake our lapsed treaty port from whoever now holds it"
 ptm_reclaim_treaty_port:0 "Reclaim Treaty Port"

 ptm_rice_expansion_tt:0 "Brings every rice paddy the land can support up to full working strength"
 ptm_china_railways_tt:0 "Funds the construction works and queues a trunk line in every populous Chinese province, and raises foreign owned trade houses and motor works in the treaty port"
 ptm_china_mining_tt:0 "Deepens the coal, iron, lead and sulfur workings of every populous Chinese province under our own flag, and raises powder mills in the treaty port"
