# config_logtriage.toml — Framework-Logtriage settings (externalized literals; vision §A/§B). Read-only TOML.
[logs]
# (filename, severity) scanned in order. severity tags the match rows (error lines drive the verdict).
files = [["error.log", "error"], ["debug.log", "debug"], ["game.log", "info"]]

[analysis]
refire_flag = 100   # marker hit-count above which a re-fire loop is suspected

[smoke]
# smoke-detector = the COMMON curated rule-out filter of known-noise error signatures (superseded benign.csv,
# whose curated rows were migrated in 2026-07-02). The TRACKED seed lives beside this config; run-log-sort
# LOADS it into log-CURR/ ROOT (the .example -> ROOT config pattern) where aggr-log-smoke accrues per-run
# counts/examples and APPENDS new unreviewed signatures (human_agreed blank) for curation. Append-only.
example = "smoke_detector.example.csv"
root    = "smoke_detector.csv"

[diag]
# diagnostics rules (NO-LITERALS): every human-readable finding string lives in this CSV, none in code.
# Tracked seed beside this config; run-log-diag LOADS it into log-CURR/ ROOT. ext-diag-eval takes --literals
# to point at ANY rules CSV (another PDX game / an experimental rule set) — the engine is swappable DATA.
example = "diag_literals.example.csv"
root    = "diag_literals.csv"

[outputs]
# COMMON (log-CURR/ ROOT) — Set 1 (run-log-sort), once per run, mod-agnostic:
raw_errors     = "raw_errors.csv"
raw_loglines   = "raw_loglines.csv"
error_patterns = "error_patterns.csv"
# PER-TARGET (log-CURR/<Mod>/ and log-CURR/_global/) — Sets 2/3:
matches = "aggr_log_matches.csv"
markers = "aggr_markers_status.csv"
metrics = "metrics.csv"
fired   = "diag_fired.csv"
report  = "diagnostics.md"
