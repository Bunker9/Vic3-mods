# config_saveparse.toml — Framework-SaveParse settings (externalized literals; vision §A/§B). Read-only TOML.
[markers]
fingerprint_infix = "_fingerprint_"

[decode]
fixed_point_factor = 100000   # Vic3 stores a numeric 'value' var as int(real * factor)

# Save-manager databases RAW-extracted ONCE (Set 1, parse-once) -> save-CURR/raw_<out>.csv
# (columns: id + the listed top-level scalar fields). Raw-ID only — enrichment is a separate join (UAT SP-02).
[managers.building_manager]
out = "raw_buildings"
# staffing/previous_staffing = OCCUPANCY in level-equivalents (staffing < levels => under-staffed "empty"
# building); last_layoff_date dates the most recent firing; salary_rate/throughput/profit_after_reserves
# separate "no job" from "job but destitute wages". All are top-level scalars in the building block.
fields = ["building", "levels", "last_updated_level", "active", "state", "subsidized", "establishment_date",
          "staffing", "previous_staffing", "hiring_rate", "salary_rate", "throughput",
          "last_layoff_date", "last_failed_hire_date", "cash_reserves", "profit_after_reserves"]
[managers.states]
out = "raw_states"
fields = ["country", "capital", "incorporation", "region", "province"]
[managers.country_manager]
out = "raw_countries"
fields = ["definition", "tag", "country_type", "market", "capital"]
# Every law slot a country holds; active=yes marks the one in force. Join on country id.
[managers.laws]
out = "raw_laws"
fields = ["law", "country", "active", "activation_date"]
[managers.state_region_manager]
out = "raw_state_regions"
fields = ["template"]
[managers.pops]
out = "raw_pops"
# workplace = the building id the pop works in; the join that attributes employment to a building.
fields = ["type", "workforce", "dependents", "location", "workplace", "culture", "religion", "wealth", "num_literate"]

[employment]
# aggr-save-employment thresholds (externalized literals; no magic numbers in the script).
# A pop workforce at/below this wealth counts DESTITUTE (idle-or-starving). Vic3 wealth is an integer
# level; employed middle-strata pops in this save sit at 15-26, unemployed ones at 1.
destitute_wealth_max = 2
# A building staffed at/below this fraction of its levels counts EMPTY (staffing is occupancy in
# level-equivalents: staffing=0.288 on levels=34 => 0.8% occupied).
empty_occupancy_max = 0.5

[goods]
# market/goods price extraction (T103): market_manager price_trend channels are keyed by NUMERIC goods id
# (last sample = current price). The CATALOG (goods_id,goods_name,base_price) is a hand-curated TRACKED
# LITERAL seeded to save-CURR/ ROOT at runtime. It is GENERATED offline by
# hk-config/tools/testbook_lookup_generators/anal-goods-ids.py (frameworks NEVER read base game files) and
# manually copied here on a game patch / new-goods DLC. Validated: 41=Tea/43=Sugar match a state's
# trade.goods ids vs its traded_goods names.
manager = "market_manager"
world_key = "world_market"
trend_key = "price_trend"
channels_key = "channels"
catalog_example = "goods_ids.example.csv"
catalog_root = "goods_ids.csv"

[census]
# GENERIC cap-variable detection (replaces the hardcoded zw_mfg_cap; T101): a persisted state/region variable
# whose NAME matches this regex is the mod's intended numeric manufacturing cap for that region. Mod-agnostic.
cap_var_pattern = "_cap(_|$)"
# Buildings governed by a STORED numeric cap (compared vs the matched cap var):
manufacturing_capped = [
  "building_steel_mills", "building_tooling_workshops", "building_textile_mills",
  "building_furniture_manufacturies", "building_glassworks", "building_paper_mills",
  "building_chemical_plants", "building_motor_industry", "building_arms_industry",
  "building_munition_plants", "building_explosives_factory", "building_synthetics_plants",
  "building_electrics_industry", "building_food_industry", "building_shipyards",
  "building_military_shipyards",
]
# Buildings gated by triggers/script-values (NO stored numeric cap -> reported MISSING-CAP, not a false pass):
trigger_capped = ["building_railway", "building_power_plant", "building_art_academy"]

[analysis]
# kw-list tokens that NEVER persist in a save (loc keys / scripted effects / triggers / decision ids / script
# values): absence is normal when the name matches this pattern; a NON-matching absent kw = suspect.
nonpersist_pattern = "_sv_|_trigger|_on_action|(_desc|_tooltip|_tt|_effect|_effects|_decision|_yearly|_startup|_check|_values?|_caps?|_levels?|_diag)$"

[diag]
# save-side diagnostics rules (NO-LITERALS): tracked seed beside this config; run-save-diag LOADS it into
# save-CURR/ ROOT. The ENGINE is the shared Framework-Logtriage ext-diag-eval/gen-diag-md (--kind save-CURR).
example = "diag_literals.example.csv"
root    = "diag_literals.csv"

[outputs]
# COMMON (save-CURR/ ROOT) — Set 1, parse-once, mod-agnostic:
flags        = "raw_flags.csv"
market_goods = "raw_market_goods.csv"
census       = "raw_state_census.csv"
# PER-MOD (save-CURR/<Mod>/) — Sets 2/3 (metrics/diagnostics names match the shared engine's conventions):
matches   = "aggr_save_matches.csv"
overbuild = "aggr_census_overbuild.csv"
metrics   = "metrics.csv"
report    = "diagnostics.md"
