l_english:
 mdp_conquer_free_minor:0 "Press Our Advantage Abroad"
 mdp_conquer_free_minor_desc:0 "A weak and unaligned neighbour lies within reach. Press claims across its provinces and bring them into our realm before a greater power does."
 mdp_annex_own_subject:0 "Bring a Vassal to Heel"
 mdp_annex_own_subject_desc:0 "One of our protectorates has outlived its usefulness as a separate state. Move to annex it outright and fold its lands into the nation."
 mdp_bic_annex_subject:0 "Annex a Princely State"
 mdp_bic_annex_subject_desc:0 "A loyal princely state under our protection is ripe for direct administration. Annex the weakest of them into the Company's territory, leaving aside any we are bound to by treaty."
 mdp_demobilize_after_conquest:0 "Beat the Swords into Ploughshares"
 mdp_demobilize_after_conquest_desc:0 "Our wars of expansion are won and the last vassal is folded into the realm. Proclaim a lasting peace: pardon the malcontents and let radicalism fade, but stand down the standing army and dismantle its barracks and supply lines. Our soldiers go home; should we be threatened, the conscript levy will answer."
 mdp_nepal_trigger_event:0 "Prepare the Tibetan Campaign"
 mdp_nepal_trigger_event_desc:0 "With China distracted, Nepal may have a brief chance to strike into Tibet."
 mdp.1.t:0 "Opportunity in Tibet"
 mdp.1.desc:0 "The Qing Empire is preoccupied elsewhere, and the moment may be right for Nepal to press its claims against Tibet."
 mdp.1.a:0 "The time to act is now."
 mdp_valid_adjacent_minor_target_tt:0 "Has at least one valid adjacent minor target"
 mdp_consolidate_frontier:0 "Consolidate the Frontier"
 mdp_consolidate_frontier_desc:0 "Our armies have folded the last free neighbours and wayward vassals into the realm; only the untamed fragments within our own frontiers remain. Bring them peacefully under our rule, forgive the debts of the long campaign, and let a grateful and loyal people celebrate a nation made whole."
 mdp_consolidate_frontier_special:0 "Consolidate the Marches"
 mdp_consolidate_frontier_special_desc:0 "Untamed peoples still hold pockets of land within our own borders. There is no need to wait: gather them peacefully under our rule now, settle our accounts, and let a grateful and loyal nation stand united behind the throne."
 mdp_ethiopia_annex_horn:0 "Unify the Horn"
 mdp_ethiopia_annex_horn_desc:0 "Ethiopia is whole once more, yet the Ogaden, the Afar coast and the Somali sultanates still lie beyond our writ. They cannot be reached by any campaign of the modern sort. Let our envoys instead bring every neighbouring people peacefully under the Imperial Crown."
 mdp_adjacent_decentralized_exists_tt:0 "A decentralized people borders our lands"
 mdp_sakhalin_decentralized_exists_tt:0 "Sakhalin is held by a decentralized people"
 mdp_decent_annex.2.t:0 "The Frontier Consolidated"
 mdp_decent_annex.2.desc:0 "The untamed peoples within our borders have been gathered peacefully under our rule, and the map of the nation is made whole at last."
 mdp_decent_annex.2.a:0 "A nation united."
 mdp_decent_annex.3.t:0 "Sakhalin Secured"
 mdp_decent_annex.3.desc:0 "The peoples of Sakhalin have been brought peacefully under our rule, and the northern frontier is ours at last."
 mdp_decent_annex.3.a:0 "The north is ours."
 mdp_consolidate_frontier_japan:0 "Nippon Secured"
 mdp_consolidate_frontier_japan_desc:0 "Nippon must secure the homeland"
 mdp_china_military_distraction:0 "Heaven's Mandate Lost"
 mdp_bic_imperial_overstretch:0 "Imperial Overstretch"
 mdp_bic_imperial_overstretch_desc:0 "The Company governs a subcontinent with a merchant board and a borrowed army. London tolerates its adventures, but the ledger and the garrisons are stretched thin."
 mdp_brazil_consolidate_amazon:0 "Consolidate the Amazon"
 mdp_brazil_consolidate_amazon_desc:0 "The deep interior answers to no one. Extend the Empire's writ over the Amazonas and Mato Grosso frontiers and make the borders of Brazil whole."
