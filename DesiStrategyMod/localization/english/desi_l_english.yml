l_english:
 desi_rebuild_war_machine:0 "Rebuild the War Machine"
 desi_rebuild_war_machine_desc:0 "Clear our debts and restore our financial footing."
 desi_rebuild_war_machine_tooltip:0 "Clears all outstanding debt."
 modifier_desi_warbonds:0 "War Bonds"
 desi_claim_heartland:0 "Reclaim the Punjab and Delhi"
 desi_claim_heartland_desc:0 "The plains of the Punjab and the throne at Delhi are the cradle of our people, yet they lie under a foreign flag. Lay our claim to them so that one day they may return home."
 desi_unify_india:0 "From the Himalayas to the Indian Ocean"
 desi_unify_india_desc:0 "From the imperial seat at Delhi we proclaim our rightful claim to every land of India, from the Himalayan snows to the shores of Ceylon. Let the subcontinent be made whole under one banner."
 desi_incorporate_state:0 "Integrate the Frontier"
 desi_incorporate_state_desc:0 "Bring one of our outlying provinces fully into the realm. The integration is immediate, but our administrators and treasury bear a heavy strain for three years, in proportion to the size of the land brought to heel."
 modifier_desi_incorporation_cost:0 "Integration Strain"
 desi_incorporation_cost_tt:0 "Incorporate our core states in India. Doing so will place a long-term strain on our treasury and bureaucracy"
 treaty_name_nep_transit_rights:0 "Transit Rights Agreement for Nepal"
 treaty_name_pan_transit_rights:0 "Transit Rights Agreement for Panjab"
 treaty_name_afg_transit_rights:0 "Transit Rights Agreement for Kabul(Afghan)"
 treaty_name_kan_transit_rights:0 "Transit Rights Agreement for Kandahar"
 desi_panjab_return_from_persia:0 "Reclaim Our Lands from Persia"
 desi_panjab_return_from_persia_desc:0 "The Shah holds lands that are rightfully ours. The Khalsa marches to bring them home."
 desi_panjab_take_kandahar:0 "The Khalsa Marches on Kandahar"
 desi_panjab_take_kandahar_desc:0 "Kandahar guards the western road. The Khalsa will bring it under our banner and open the frontier."
 desi_peacock_throne:0 "Claim the Peacock Throne"
 desi_peacock_throne_desc:0 "Delhi is ours, and a throne without an emperor invites another to sit in it. Move the court to the imperial capital and let every court in India see where power now rests."
 desi_peacock_throne_tt:0 "Moves our capital to Delhi"
 desi_holds_incorporated_delhi_tt:0 "We hold an incorporated state in Delhi"
 desi_holds_part_of_delhi_tt:0 "We hold at least part of Delhi"
