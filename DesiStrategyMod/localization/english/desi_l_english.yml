 desi_claim_heartland:0 "Reclaim the Pecock Throne"
 desi_claim_heartland_desc:0 "The plains of the Punjab and the throne at Delhi are the cradle of our people, yet they lie under a foreign flag. Lay our claim to them so that one day they may return home."
