# Top40EcoBoostMod — test properties.
# The generic test scripts read THIS file (by mod name); no mod-specific strings live in
# the scripts themselves. Copy this file into a new mod's test- folder and edit the values.

[census]
# The mod logs a debug_log header (building name) per building, then one marker per level.
marker      = "ECO_PLACED"        # marker prefix that counts one PLACED level (built this run)
have_marker = "ECO_HAVE"          # marker prefix that counts one PRE-EXISTING level (needed = cap - have)
source_file = "eco_effects.txt"   # the mod file whose debug_log lines carry headers + markers
# ADDITIVE types ALWAYS build their cap regardless of existing (flavour = guaranteed +1 seed),
# so they're checked differently: OK = placed >= cap (built the seed), not have+placed == cap.
additive_types = ["flavour"]

# Expected result: building display name -> { type, cap }. The census flags placed == cap.
[census.expected]
"Cotton Plantations" = { type = "champ",   cap = 10 }
"Opium Plantations"  = { type = "support", cap = 5 }
"Sugar Plantations"  = { type = "support", cap = 5 }
"Tea Plantations"    = { type = "support", cap = 5 }
"Textile Mills"      = { type = "support", cap = 5 }
"Artillery Foundry"  = { type = "flavour", cap = 1 }
"Paper Mills"        = { type = "flavour", cap = 1 }
"Coffee Plantations" = { type = "flavour", cap = 1 }
"Tooling Workshops"  = { type = "flavour", cap = 1 }
"Iron Mines"         = { type = "flavour", cap = 1 }
"Logging Camps"      = { type = "flavour", cap = 1 }
"Steel Mills"        = { type = "champ",   cap = 14 }
"Explosives Factory" = { type = "support", cap = 7 }
"Fertilizer Plants"  = { type = "support", cap = 7 }
"Motor Industries"   = { type = "support", cap = 7 }

[errors]
# Identifiers beyond the mod's filenames that should attribute a log error to this mod.
extra_signatures = ["eco.2", "eco.3", "eco_startup"]
# Mod-specific substrings to treat as benign (non-blocking) in error.log.
benign = []
