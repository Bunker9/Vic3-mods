 eco_oil_partnership:0 "The Omani Oil Concord"
 eco_oil_partnership_desc:0 "We hold the pumpjack, Oman holds the oil. Share the engineering with the Sultan, sink wells across his coast under our ownership, and take the crude home under treaty."
 eco_oil_partnership_tt:0 "Give Oman the pumpjack, survey and drill every Omani field for our own account, and sign the Concord: Omani oil and trade privileges to us, money and military assistance to them"
 eco_oil_partnership_gate_tt:0 "Oman is not at war"
 eco_rubber_partnership:0 "The Rubber Concords"
 eco_rubber_partnership_desc:0 "Mastication has made rubber precious, and the finest groves are Brazilian and Siamese. Share the process, plant the estates ourselves, and bind both trades to us."
 eco_rubber_partnership_tt:0 "Give Brazil and Siam the mastication process, plant and own rubber estates across both, and sign a Concord with each: their rubber and trade privileges to us, money and military assistance to them"
 eco_rubber_partnership_gate_tt:0 "Brazil is not at war"
