l_english:
 stdinnv_unrecognized:0 "A Society Behind the Times"
 stdinnv_unrecognized_desc:0 "Our workshops copy what others invented decades ago, and word of new methods reaches us slowly. Until our scholars catch up, our industry will lag the recognized powers."
 stdinnv_subject:0 "Knowledge in Foreign Hands"
 stdinnv_subject_desc:0 "As a dependency our brightest minds serve another's empire. Innovation stalls, our prestige withers, and the latest techniques are kept well beyond our reach."
 stdinnv_boost_gp:0 "An Engine of Innovation"
 stdinnv_boost_gp_desc:0 "Our universities, presses and laboratories are the envy of the world. New ideas spread quickly here, and the great powers look to us to set the pace."
 stdinnv_reward:0 "The Awakening of a Nation"
 stdinnv_reward_desc:0 "Our halls of learning have finally borne fruit. A generation of scholars, engineers and reformers now drives the nation forward and the wider world begins to take notice."
 stdinnv_uni_built:0 "A Nation of Scholars"
 stdinnv_uni_built_desc:0 "Ten universities now crown our greatest state. Once we stand as a recognized power in our own right, this wellspring of learning can lift us onto the world stage."
 stdinnv_uni_built_tooltip:0 "Raise universities to level 10 in a single state to awaken the nation."
 uni_event.1.t:0 "Halls of Learning"
 uni_event.1.desc:0 "Our finest minds have gathered in lecture halls and laboratories across the realm. For the first time the old order of landed lords and entrenched interests yields to a confident new elite, eager to take our place among the nations of the world."
 uni_event.1.a:0 "Let the age of reason begin."
 aus_crownland_management_50y:0 "Crownland Management"
 aus_crownland_management_50y_desc:0 "The Austrian administration is exerting sustained effort to keep the Crown Lands cooperative, reducing separatist pressure and smoothing subject governance."
 hungary_reconciled_to_vienna_50y:0 "Reconciled to Vienna"
 hungary_reconciled_to_vienna_50y_desc:0 "A temporary settlement with Vienna has eased Hungarian resistance to imperial oversight, lowering liberty desire for a generation."
 stdinnv_austria_uni_art_paper_built: "Reorganize the Crownlands"
 stdinnv_austria_uni_art_paper_built_desc: "With Hungary fully integrated, we can now bring the remaining crownlands fully into the imperial fold."
 stdinnv_austria_uni_art_paper_built_tooltip: "A new Hungarian arts and science renaissance."
 uni_event.2.t:0 "The Imperial Reorganization"
 uni_event.2.desc:0 "With Hungary fully integrated into the Habsburg fold, the moment has come to bring our remaining crownlands into full imperial standing. Each territory shall receive the institutions befitting a true province of the Empire — universities to educate the populace and academies to cultivate the arts."
 uni_event.2.a:0 "Let the Empire flourish from Tyrol to Transylvania."

