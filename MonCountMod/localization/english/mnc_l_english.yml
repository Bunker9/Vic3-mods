 mnc_spa_hosts_van_helsing_endorsements:0 "Van Helsing Construction Company's German Outreach"
 mnc_spa_hosts_van_helsing_banking:0 "Van Helsing Construction Company's Banking Outreach"
 company_van_helsing:0 "Van Helsing Construction Company"
