 mnc_the_count:0 "The Count"
 mnc_of_montenegro:0 "of Montenegro"
 mnc_counts_greed:0 "The Count's Blessings"
 mnc_counts_library:0 "The Count's Library"
 mnc_counts_library_desc:0 "Four centuries of ledgers, letters and stolen manuscripts, kept in a cellar that has never seen daylight. The Count reads faster than his scholars can copy."
 mnc_count_of_montenegro:0 "The Count of Montenegro"
 mnc_count_of_montenegro_desc:0 "Foreign gold pays for bread, schooling and honest wages in the Black Mountain, and a household here lives far better than its stony fields could ever provide. The Count asks only that his accounts be settled at night, and in person. Those of noble blood who keep such appointments are not always seen at breakfast."

 company_lovcen_concordat:0 "Lovćen Golden Concordat"
 company_lovcen_concordat_desc:0 "The princes of the Black Mountain hold no coast, no coin and no bank, yet their agents sit on the gold of Bohemia and the paper of Vienna and Constantinople. What the mountain cannot grow, it owns abroad."
 treaty_name_mnc_lovcen_vienna:0 "Lovćen Vienna Convention"
 treaty_name_mnc_lovcen_london:0 "Lovćen London Investment Accord"
 treaty_name_mnc_lovcen_petersburg:0 "Lovćen Petersburg Investment Accord"
 treaty_name_mnc_lovcen_rome:0 "Lovćen Roman Concord"

 geographic_region_mnc_transylvania:0 "The Count's Old Country"
 geographic_region_mnc_montenegro:0 "The Black Mountain"

 pm_mnc_thralls:0 "Thralls Meat Quota"
 pmg_mnc_salon:0 "Salon"
 pm_mnc_no_salons:0 "Shutters Drawn"
 pm_mnc_thralls_salon:0 "Thralls at the Salon"
 pm_mnc_salon_option_a:0 "Wine and Cigars"
 pm_mnc_salon_option_b:0 "Liquor and Broadsheets"

 mnc_reclaim_montenegro:0 "Redeem the Black Mountain"
 mnc_reclaim_montenegro_desc:0 "The Concordat stands at the height of its fortune. Vienna will part with its corner of our homeland for a million in gold and a debt of honour owed in return."
 mnc_reclaim_tt:0 "Austria cedes its share of Montenegro. Austria receives 1 million pounds from our investment pool, and we owe Austria an obligation."
 building_company_lovcen_concordat:0 "Lovćen Golden Concordat HQ"

 mnc_suez_rush:0 "Buy the Sands of Suez"
 mnc_suez_rush_desc:0 "Cairo has no interest in our rank, only in our money, and our clerks have counted enough of it to survey, bribe and purchase in a single season. Where the Great Powers send expeditions, the Count sends a banker."
 mnc_suez_rush_tt:0 "Within a week we acquire the canal ground in the Sinai and pay its owner handsomely. Four months later our private investors assume the cost, and no other nation will survey the isthmus again."
 mnc_private_suez_purchase:0 "Private Backed Suez Purchase"
 mnc_private_suez_purchase_desc:0 "The Concordat's investors hold the deeds to the canal ground and pocket the tolls. The treasury pays nothing and receives a share, though the paperwork consumes a great deal of our administration."

 mnc_landowner_persuasion:0 "An Evening with the Landowners"
 mnc_landowner_persuasion_desc:0 "The head of the landed interest keeps a standing invitation to the castle, and has never once refused it. Ten million in Concordat money buys a very long dinner, and men leave that table holding opinions they did not arrive with."
 mnc_landowner_persuasion_tt:0 "Ten million is drawn from our investment pool. We may recast the convictions of the Landowner leader, or spend the evening pressing our case for the law now before the country. The Landowners will not sit down with us again for five years."
 mnc_event.4.t:0 "An Evening with the Landowners"
 mnc_event.4.d:0 "The candles are lit at ten and the doors are barred at midnight. Our guest arrives certain of himself, takes the chair the Count offers him, and by the small hours he is agreeing to propositions he would have called treason at supper. The only question is what we wish him to believe by morning."
 mnc_event.4.f:0 "Nothing was written down. Nothing needed to be."
 mnc_event.4.a:0 "Let him wake a reformer"
 mnc_event.4.b:0 "Let him wake a market liberal"
 mnc_event.4.c:0 "Spend the night on the bill before the country"
 mnc_landowner_persuasion_cooldown:0 "Landowners Handled"
 mnc_landowner_persuasion_cooldown_desc:0 "The landed men know when they have been managed, even if none of them can say quite how. They keep their distance from the castle, and their weight in our politics suffers for the sulk."
 mnc_landowner_enactment_push:0 "The Count's Whip"
 mnc_landowner_enactment_push_desc:0 "Every wavering vote has been visited at home, at night, by someone very persuasive. The bill will pass."
