 mnc_counts_library:0 "The Count's Library"
 mnc_counts_library_desc:0 "Four centuries of ledgers, letters and stolen manuscripts, kept in a cellar that has never seen daylight. The Count reads faster than his scholars can copy."
 mnc_count_of_montenegro:0 "The Count of Montenegro"
 mnc_count_of_montenegro_desc:0 "Foreign gold pays for bread, schooling and honest wages in the Black Mountain, and a household here lives far better than its stony fields could ever provide. The Count asks only that his accounts be settled at night, and in person. Those of noble blood who keep such appointments are not always seen at breakfast."

